[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "boardmodeler"
version = "1.6.0"
description = "Spice Maker: datasheet-grounded LTspice model authoring judged by real simulator runs"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Spice Maker" }]
dependencies = [
    "pydantic>=2.12,<3",
    "numpy>=2.5,<3",
    "pypdf>=6.19,<7",
    "pypdfium2>=5.13,<6",
]

[project.optional-dependencies]
sim = ["spicelib>=1.6,<2"]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "reportlab>=5.0",
    "psutil>=7.2",
]

[project.scripts]
boardmodeler = "boardmodeler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/boardmodeler"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ltspice: requires the local LTspice executable",
    "network: requires outbound network egress",
]
filterwarnings = ["error::DeprecationWarning:boardmodeler.*"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]
extend-exclude = ["docs/evidence"]

[tool.ruff.format]
exclude = [
    "src/boardmodeler/authoring/sanity.py",
    "src/boardmodeler/simulation/ltspice.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
