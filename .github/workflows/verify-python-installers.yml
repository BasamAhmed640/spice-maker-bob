name: Verify Windows Python installers

# Hosted runner images already contain Python 3.14 in their tool cache. Invoke the
# pinned installers directly so this check really exercises both architectures.
on:
  workflow_dispatch:
  push:
    branches: [terminal-app]

permissions:
  contents: read

jobs:
  user-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: windows-2025
            platform: win-amd64
            registry_tag: '3.14'
          - architecture: arm64
            runner: windows-11-arm
            platform: win-arm64
            registry_tag: '3.14-arm64'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, and run the per-user installer
        shell: pwsh
        env:
          PIN_ARCH: ${{ matrix.architecture }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          REGISTRY_TAG: ${{ matrix.registry_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pinLine = @(Get-Content -LiteralPath 'tools/python-install-pins.txt' |
            Where-Object { $_.StartsWith("$env:PIN_ARCH|") })
          if ($pinLine.Count -ne 1) { throw "Expected one pin for $env:PIN_ARCH" }
          $parts = $pinLine[0].Split('|')
          if ($parts.Count -ne 5) { throw 'Malformed Python installer pin' }
          $url = $parts[1]
          $expectedHash = $parts[2].ToLowerInvariant()
          $expectedBytes = [long]$parts[3]
          $installer = Join-Path $env:RUNNER_TEMP "python-3.14.7-$env:PIN_ARCH.exe"
          $installLog = Join-Path $env:RUNNER_TEMP "python-3.14.7-$env:PIN_ARCH-install.log"

          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer
          if ((Get-Item -LiteralPath $installer).Length -ne $expectedBytes) {
            throw 'Python installer size does not match the pin'
          }
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Python installer SHA-256 mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') { throw "Invalid installer signature: $($signature.Status)" }

          $arguments = @(
            '/quiet', 'InstallAllUsers=0', 'PrependPath=0', 'AppendPath=0',
            'AssociateFiles=0', 'Shortcuts=0', 'Include_launcher=0',
            'Include_doc=0', 'Include_test=0', 'Include_tcltk=0',
            'Include_tools=0', '/log', "`"$installLog`""
          )
          $install = Start-Process -FilePath $installer -ArgumentList $arguments `
            -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "Python installer exited $($install.ExitCode); log: $installLog"
          }

          $regPath = "HKCU:\Software\Python\PythonCore\$env:REGISTRY_TAG\InstallPath"
          $python = (Get-ItemProperty -LiteralPath $regPath -Name ExecutablePath).ExecutablePath
          if (-not (Test-Path -LiteralPath $python)) { throw "No Python at $python" }
          $platform = & $python -I -c 'import sys,sysconfig; assert sys.implementation.name == "cpython" and sys.version_info[:2] == (3,14); print(sysconfig.get_platform())'
          if ($LASTEXITCODE -ne 0 -or $platform.Trim() -ne $env:EXPECTED_PLATFORM) {
            throw "Wrong Python platform: $platform"
          }
          Write-Host "Installed CPython 3.14 for this user: $python ($platform)"
          Remove-Item -LiteralPath $installer
