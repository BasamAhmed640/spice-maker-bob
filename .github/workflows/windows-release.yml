name: Windows download
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (x.y.z)
        required: true
        default: '1.1.5'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: uv sync --frozen --all-extras
      - run: dotnet tool install --global vpk --version 1.2.0
      - name: Build animated installer and download zip
        env:
          INSTALLER_VERSION: ${{ inputs.version }}
        run: ./installer/build.ps1 -Version $env:INSTALLER_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-download
          path: releases/*-Windows-x64.zip
          if-no-files-found: error
